<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Hawaiian Hotspot Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #090d16; font-family: sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body class="text-slate-100 select-none">

  <!-- Three.js Render Target -->
  <div id="canvas-container"></div>

  <!-- UI Overlay -->
  <div class="absolute top-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md p-5 rounded-2xl border border-slate-700/60 shadow-2xl max-w-sm w-full">
    <h1 class="text-xl font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
      Hawaiian Hotspot 3D
    </h1>
    <p class="text-xs text-slate-400 mt-1 mb-4">
      Mantle plume & ocean plate drift simulation.
    </p>

    <div class="space-y-4 text-sm">
      <!-- Speed Slider -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Pacific Plate Speed</span>
          <span id="speed-val" class="text-sky-400">8.5 cm/yr</span>
        </div>
        <input id="speed-range" type="range" min="1" max="20" step="0.5" value="8.5" class="w-full accent-sky-400 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
      </div>

      <!-- Plume Intensity Slider -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Plume Magma Supply</span>
          <span id="plume-val" class="text-orange-400">1.0x</span>
        </div>
        <input id="plume-range" type="range" min="0.2" max="2.5" step="0.1" value="1.0" class="w-full accent-orange-500 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
      </div>

      <!-- Sea Level Slider -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Sea Level Offset</span>
          <span id="sea-val" class="text-blue-400">0 m</span>
        </div>
        <input id="sea-range" type="range" min="-15" max="15" step="1" value="0" class="w-full accent-blue-400 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
      </div>

      <!-- Live Readouts -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs">
        <div class="bg-slate-800/50 p-2 rounded-lg">
          <span class="text-slate-400 block">Geological Time</span>
          <span id="time-val" class="font-bold text-amber-400 text-sm">0.0 Ma</span>
        </div>
        <div class="bg-slate-800/50 p-2 rounded-lg">
          <span class="text-slate-400 block">Active Islands</span>
          <span id="count-val" class="font-bold text-emerald-400 text-sm">0</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2 pt-2">
        <button id="toggle-btn" class="flex-1 py-2 px-3 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 rounded-lg font-semibold text-xs transition-all shadow-md">
          Pause
        </button>
        <button id="reset-btn" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 rounded-lg font-semibold text-xs border border-slate-700 transition-all">
          Reset
        </button>
      </div>
    </div>
  </div>

  <!-- Legend Overlay -->
  <div class="absolute bottom-4 left-4 z-10 bg-slate-900/80 backdrop-blur-md px-4 py-2 rounded-xl border border-slate-700/60 text-xs flex gap-4 text-slate-300">
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block animate-pulse"></span> Active Hotspot</div>
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600 inline-block"></span> High Island</div>
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-stone-500 inline-block"></span> Submerged Guyot</div>
  </div>

  <!-- JavaScript Simulation Core -->
  <script>
    // --- Application State ---
    let plateSpeed = 8.5;
    let plumeIntensity = 1.0;
    let seaLevelOffset = 0;
    let isRunning = true;
    let geoTime = 0;
    let islands = [];

    const HOTSPOT_POS = new THREE.Vector3(15, 0, 0); // Stationary Plume X position

    // --- Three.js Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0f1d);
    scene.fog = new THREE.FogExp2(0x0a0f1d, 0.008);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(25, 35, 65);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent going below ground

    // --- Lights ---
    const ambientLight = new THREE.AmbientLight(0xdbeafe, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
    sunLight.position.set(40, 60, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 150;
    sunLight.shadow.camera.left = -50;
    sunLight.shadow.camera.right = 50;
    sunLight.shadow.camera.top = 50;
    sunLight.shadow.camera.bottom = -50;
    scene.add(sunLight);

    // --- Environment / Geology Meshes ---

    // 1. Mantle / Crust Base
    const crustGeo = new THREE.BoxGeometry(100, 4, 30);
    const crustMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
    const crust = new THREE.Mesh(crustGeo, crustMat);
    crust.position.y = -2;
    crust.receiveShadow = true;
    scene.add(crust);

    // 2. Ocean Water Mesh
    const oceanGeo = new THREE.PlaneGeometry(120, 50);
    const oceanMat = new THREE.MeshPhysicalMaterial({
      color: 0x0284c7,
      transparent: true,
      opacity: 0.65,
      roughness: 0.1,
      transmission: 0.6,
      ior: 1.333
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = 3;
    scene.add(ocean);

    // 3. Mantle Plume (Lava Column)
    const plumeGeo = new THREE.CylinderGeometry(1.2, 3.5, 12, 32);
    const plumeMat = new THREE.MeshBasicMaterial({
      color: 0xff3300,
      wireframe: true
    });
    const plume = new THREE.Mesh(plumeGeo, plumeMat);
    plume.position.set(HOTSPOT_POS.x, -4, 0);
    scene.add(plume);

    // Hotspot Core Light
    const plumeLight = new THREE.PointLight(0xff4500, 3, 20);
    plumeLight.position.set(HOTSPOT_POS.x, 1, 0);
    scene.add(plumeLight);

    // Directional Arrow for Plate Motion
    const dirArrow = new THREE.ArrowHelper(
      new THREE.Vector3(-1, 0, 0),
      new THREE.Vector3(25, 4.5, 0),
      10,
      0x38bdf8,
      2,
      1
    );
    scene.add(dirArrow);

    // --- Island Class ---
    class Island {
      constructor(x, z) {
        this.x = x;
        this.z = z;
        this.height = 0.5;
        this.radius = 2.0;
        this.age = 0; // Millions of years
        this.isEroding = false;

        // Custom Cone Geometry for Shield Volcano
        const geo = new THREE.ConeGeometry(this.radius, this.height, 32);
        const mat = new THREE.MeshStandardMaterial({
          color: 0xff4500, // Starts as hot lava
          roughness: 0.8,
          metalness: 0.1
        });

        this.mesh = new THREE.Mesh(geo, mat);
        this.mesh.castShadow = true;
        this.mesh.receiveShadow = true;
        this.updatePosition();

        scene.add(this.mesh);
      }

      updatePosition() {
        this.mesh.position.set(this.x, this.height / 2, this.z);
        this.mesh.scale.set(this.radius, this.height, this.radius);
      }

      grow(deltaIntensity) {
        if (this.height < 9 * plumeIntensity) {
          this.height += 0.08 * deltaIntensity;
          this.radius += 0.05 * deltaIntensity;
        }
        // Cooling color transition (Lava red -> Lush Green)
        if (this.height > 2) {
          this.mesh.material.color.setHex(0x15803d); // Fertile volcanic soil
        }
        this.updatePosition();
      }

      erode() {
        this.isEroding = true;
        // Thermal subsidence & wave erosion
        if (this.height > 0.2) {
          this.height -= 0.015 * (plateSpeed / 8);
          this.radius += 0.005; // Spreads out slightly as it flattens
        }
        // Submerged Guyot transition
        if (this.height < ocean.position.y) {
          this.mesh.material.color.setHex(0x64748b); // Basaltic rock
        }
        this.updatePosition();
      }

      destroy() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.mesh.material.dispose();
      }
    }

    // --- UI Controls Integration ---
    const speedRange = document.getElementById('speed-range');
    const plumeRange = document.getElementById('plume-range');
    const seaRange = document.getElementById('sea-range');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetBtn = document.getElementById('reset-btn');

    speedRange.addEventListener('input', (e) => {
      plateSpeed = parseFloat(e.target.value);
      document.getElementById('speed-val').innerText = `${plateSpeed.toFixed(1)} cm/yr`;
    });

    plumeRange.addEventListener('input', (e) => {
      plumeIntensity = parseFloat(e.target.value);
      document.getElementById('plume-val').innerText = `${plumeIntensity.toFixed(1)}x`;
      plume.scale.set(plumeIntensity, 1, plumeIntensity);
      plumeLight.intensity = 3 * plumeIntensity;
    });

    seaRange.addEventListener('input', (e) => {
      seaLevelOffset = parseFloat(e.target.value);
      document.getElementById('sea-val').innerText = `${seaLevelOffset * 100} m`;
      ocean.position.y = 3 + seaLevelOffset * 0.2;
    });

    toggleBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      toggleBtn.innerText = isRunning ? 'Pause' : 'Resume';
      toggleBtn.className = isRunning
        ? 'flex-1 py-2 px-3 bg-amber-600 hover:bg-amber-500 rounded-lg font-semibold text-xs'
        : 'flex-1 py-2 px-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-semibold text-xs';
    });

    resetBtn.addEventListener('click', () => {
      islands.forEach(i => i.destroy());
      islands = [];
      geoTime = 0;
      document.getElementById('time-val').innerText = `0.0 Ma`;
      document.getElementById('count-val').innerText = `0`;
    });

    // --- Main Simulation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (isRunning) {
        geoTime += delta * 0.2;
        document.getElementById('time-val').innerText = `${geoTime.toFixed(1)} Ma`;

        const shiftStep = (plateSpeed / 10) * delta * 2;

        // Move all islands northwest (-X direction)
        for (let i = islands.length - 1; i >= 0; i--) {
          const island = islands[i];
          island.x -= shiftStep;
          island.age += delta * 0.2;

          // If island drifts away from active plume zone
          if (Math.abs(island.x - HOTSPOT_POS.x) > 3.0) {
            island.erode();
          } else {
            // Over hotspot -> Growth phase
            island.grow(plumeIntensity * delta * 5);
          }

          // Cleanup far off-screen islands
          if (island.x < -45) {
            island.destroy();
            islands.splice(i, 1);
          }
        }

        // Spawn new volcano over hotspot if no active island exists near center
        const activeIsland = islands.find(i => Math.abs(i.x - HOTSPOT_POS.x) < 3.0);
        if (!activeIsland) {
          const newIsland = new Island(HOTSPOT_POS.x, (Math.random() - 0.5) * 2);
          islands.push(newIsland);
        }

        // Update UI Counter
        document.getElementById('count-val').innerText = islands.length;

        // Plume pulse animation
        plume.rotation.y += 0.01;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    // Handle Window Resizing
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start Simulation
    animate();
  </script>
</body>
</html>
