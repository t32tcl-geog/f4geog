<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hawaiian Hotspot 3D Simulator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Import Three.js via ES Modules to guarantee proper module resolution -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #030712; font-family: ui-sans-serif, system-ui, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; display: block; }
  </style>
</head>
<body class="text-slate-100 select-none">

  <div id="canvas-container"></div>

  <!-- Educational Control Panel -->
  <div class="absolute top-4 left-4 z-10 bg-slate-900/90 backdrop-blur-md p-5 rounded-2xl border border-slate-700/60 shadow-2xl max-w-sm w-full">
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-bold bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">
        Hawaiian Hotspot 3D
      </h1>
      <span class="text-[10px] bg-amber-500/10 border border-amber-500/30 text-amber-400 px-2 py-0.5 rounded-full font-mono">EDUCATIONAL</span>
    </div>
    <p class="text-xs text-slate-400 mt-1 mb-4">
      Simulate mantle plume volcanism, plate drift, and island erosion.
    </p>

    <div class="space-y-4 text-sm">
      <!-- Plate Speed -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Pacific Plate Speed</span>
          <span id="speed-val" class="text-sky-400 font-mono">8.5 cm/yr</span>
        </div>
        <input id="speed-range" type="range" min="1" max="20" step="0.5" value="8.5" class="w-full accent-sky-400 cursor-pointer h-1.5 bg-slate-800 rounded-lg">
      </div>

      <!-- Plume Magma Output -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Plume Magma Output</span>
          <span id="plume-val" class="text-orange-400 font-mono">1.0x</span>
        </div>
        <input id="plume-range" type="range" min="0.2" max="2.5" step="0.1" value="1.0" class="w-full accent-orange-500 cursor-pointer h-1.5 bg-slate-800 rounded-lg">
      </div>

      <!-- Sea Level Offset -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span class="text-slate-300">Sea Level Offset</span>
          <span id="sea-val" class="text-blue-400 font-mono">0 m</span>
        </div>
        <input id="sea-range" type="range" min="-5" max="5" step="0.5" value="0" class="w-full accent-blue-400 cursor-pointer h-1.5 bg-slate-800 rounded-lg">
      </div>

      <!-- Simulation Statistics -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800 text-xs">
        <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px]">Geological Age</span>
          <span id="time-val" class="font-bold font-mono text-amber-400 text-sm">0.0 Ma</span>
        </div>
        <div class="bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
          <span class="text-slate-400 block text-[10px]">Islands Formed</span>
          <span id="count-val" class="font-bold font-mono text-emerald-400 text-sm">0</span>
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="flex gap-2 pt-1">
        <button id="toggle-btn" class="flex-1 py-2 px-3 bg-amber-600 hover:bg-amber-500 active:bg-amber-700 rounded-xl font-semibold text-xs transition-all shadow-md">
          Pause
        </button>
        <button id="reset-btn" class="py-2 px-3 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 rounded-xl font-semibold text-xs border border-slate-700 transition-all">
          Reset
        </button>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="absolute bottom-4 left-4 z-10 bg-slate-900/90 backdrop-blur-md px-4 py-2.5 rounded-xl border border-slate-700/60 text-xs flex gap-4 text-slate-300">
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse"></span> Active Hotspot</div>
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-emerald-600"></span> High Shield Island</div>
    <div class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-slate-500"></span> Eroded Guyot</div>
  </div>

  <!-- Simulation Application Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Simulation Parameters
    let plateSpeed = 8.5;
    let plumeIntensity = 1.0;
    let isRunning = true;
    let geoTime = 0;
    let islands = [];

    const HOTSPOT_X = 12;

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.012);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 25, 45);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.01;
    controls.target.set(0, 0, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xc7d2fe, 0.7);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
    sunLight.position.set(30, 50, 20);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    scene.add(sunLight);

    // Mantle Base & Oceanic Crust
    const crustGeo = new THREE.BoxGeometry(80, 4, 24);
    const crustMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 });
    const crust = new THREE.Mesh(crustGeo, crustMat);
    crust.position.set(0, -2, 0);
    crust.receiveShadow = true;
    scene.add(crust);

    // Ocean Surface
    const oceanGeo = new THREE.PlaneGeometry(100, 40);
    const oceanMat = new THREE.MeshPhysicalMaterial({
      color: 0x0284c7,
      transparent: true,
      opacity: 0.65,
      roughness: 0.1,
      transmission: 0.7,
      ior: 1.333
    });
    const ocean = new THREE.Mesh(oceanGeo, oceanMat);
    ocean.rotation.x = -Math.PI / 2;
    ocean.position.y = 2;
    scene.add(ocean);

    // Mantle Plume Visualizer
    const plumeGeo = new THREE.CylinderGeometry(0.8, 2.5, 8, 24);
    const plumeMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
    const plume = new THREE.Mesh(plumeGeo, plumeMat);
    plume.position.set(HOTSPOT_X, -2, 0);
    scene.add(plume);

    const plumeLight = new THREE.PointLight(0xff2200, 4, 15);
    plumeLight.position.set(HOTSPOT_X, 0.5, 0);
    scene.add(plumeLight);

    // Island Construction Helper
    class Island {
      constructor(x, z) {
        this.x = x;
        this.z = z;
        this.height = 0.2;
        this.radius = 1.2;
        this.age = 0;

        // Cone anchored at base center
        const geo = new THREE.ConeGeometry(1, 1, 32);
        geo.translate(0, 0.5, 0); // Shift pivot point to cone base

        this.mat = new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.8 });
        this.mesh = new THREE.Mesh(geo, this.mat);
        this.mesh.castShadow = true;
        this.mesh.receiveShadow = true;

        this.updateTransform();
        scene.add(this.mesh);
      }

      updateTransform() {
        this.mesh.position.set(this.x, 0, this.z);
        this.mesh.scale.set(this.radius, this.height, this.radius);
      }

      grow(delta) {
        if (this.height < 6 * plumeIntensity) {
          this.height += 0.06 * delta * plumeIntensity;
          this.radius += 0.04 * delta * plumeIntensity;
        }
        if (this.height > 2.2) {
          this.mat.color.setHex(0x15803d); // Lush vegetated volcanic soil
        }
        this.updateTransform();
      }

      erode(delta) {
        if (this.height > 0.1) {
          this.height -= 0.012 * delta * (plateSpeed / 8);
          this.radius += 0.003 * delta;
        }
        if (this.height < ocean.position.y) {
          this.mat.color.setHex(0x64748b); // Submerged rock guyot
        }
        this.updateTransform();
      }

      destroy() {
        scene.remove(this.mesh);
        this.mesh.geometry.dispose();
        this.mat.dispose();
      }
    }

    // UI Event Handlers
    document.getElementById('speed-range').addEventListener('input', (e) => {
      plateSpeed = parseFloat(e.target.value);
      document.getElementById('speed-val').innerText = `${plateSpeed.toFixed(1)} cm/yr`;
    });

    document.getElementById('plume-range').addEventListener('input', (e) => {
      plumeIntensity = parseFloat(e.target.value);
      document.getElementById('plume-val').innerText = `${plumeIntensity.toFixed(1)}x`;
      plume.scale.set(plumeIntensity, 1, plumeIntensity);
    });

    document.getElementById('sea-range').addEventListener('input', (e) => {
      const offset = parseFloat(e.target.value);
      document.getElementById('sea-val').innerText = `${offset * 100} m`;
      ocean.position.y = 2 + offset * 0.2;
    });

    const toggleBtn = document.getElementById('toggle-btn');
    toggleBtn.addEventListener('click', () => {
      isRunning = !isRunning;
      toggleBtn.innerText = isRunning ? 'Pause' : 'Resume';
      toggleBtn.className = isRunning
        ? 'flex-1 py-2 px-3 bg-amber-600 hover:bg-amber-500 rounded-xl font-semibold text-xs'
        : 'flex-1 py-2 px-3 bg-emerald-600 hover:bg-emerald-500 rounded-xl font-semibold text-xs';
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      islands.forEach(i => i.destroy());
      islands = [];
      geoTime = 0;
      document.getElementById('time-val').innerText = `0.0 Ma`;
      document.getElementById('count-val').innerText = `0`;
    });

    // Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (isRunning) {
        geoTime += delta * 0.3;
        document.getElementById('time-val').innerText = `${geoTime.toFixed(1)} Ma`;

        const shift = (plateSpeed / 10) * delta * 2;

        for (let i = islands.length - 1; i >= 0; i--) {
          const island = islands[i];
          island.x -= shift;
          island.age += delta * 0.3;

          if (Math.abs(island.x - HOTSPOT_X) < 2.5) {
            island.grow(delta * 5);
          } else {
            island.erode(delta * 5);
          }

          if (island.x < -35) {
            island.destroy();
            islands.splice(i, 1);
          }
        }

        const activeIsland = islands.find(i => Math.abs(i.x - HOTSPOT_X) < 2.5);
        if (!activeIsland) {
          islands.push(new Island(HOTSPOT_X, (Math.random() - 0.5) * 1.5));
        }

        document.getElementById('count-val').innerText = islands.length;
        plume.rotation.y += 0.01;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
